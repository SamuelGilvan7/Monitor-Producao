<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFab - Sistema de Produção</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <div class="header-content">
      <h1>TechFab Control</h1>
      <p>Monitoramento Inteligente de Produção e Máquinas</p>
      <div class="header-divider"></div>
    </div>
  </header>

  <div class="container py-2">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">Registrar Produção</h5>
            <div class="mb-3">
              <label class="form-label">Produto</label>
              <input type="text" id="produto" class="form-control" placeholder="Ex: Painel Solar">
            </div>
            <div class="mb-3">
              <label class="form-label">Quantidade</label>
              <input type="number" id="qtd" class="form-control" placeholder="0">
            </div>
            <div class="mb-3">
              <label class="form-label">Meta do Dia</label>
              <input type="number" id="meta" class="form-control" placeholder="0">
            </div>
            <button id="btnRegistrar" class="btn btn-primary w-100">Registrar Produção</button>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h5 class="card-title">⚠️ Status das Máquinas</h5>
            <p class="small text-muted">Limite de Segurança: 100 km/h</p>
            <button id="btnVerificarMaquinas" class="btn btn-outline-warning w-100">Iniciar Diagnóstico</button>
            <div id="resultadoMaquinas" class="mt-3"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="row mb-4">
          <div class="col-md-6">
            <div class="card bg-primary text-white text-center">
              <div class="card-body">
                <h6>Total Produzido</h6>
                <h2 id="somaTotal">0</h2>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card bg-dark text-white text-center">
              <div class="card-body">
                <h6>Máquinas em Alerta</h6>
                <h2 id="totalAlertas">0</h2>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h5 class="card-title mb-4">Histórico de Produção</h5>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>Produto</th>
                    <th>Produção / Meta</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="listaProducao">
                  </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
